name: Deploy to Production

on:
  push:
    tags:
      - 'v*'   # triggers on v1.0.0, v1.2.3, etc.

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="/opt/misbahulhoda"
            VERSION="${{ github.ref_name }}"

            echo "=== Deploying $VERSION ==="

            cd "$APP_DIR"
            git fetch --tags
            git checkout "$VERSION"

            echo "=== Building containers (version: $VERSION) ==="
            docker compose down --remove-orphans
            docker compose build --build-arg APP_VERSION="$VERSION"
            docker compose up -d

            echo "=== Cleaning old images ==="
            docker image prune -f

            echo "=== Status ==="
            docker compose ps

            echo "=== Live: https://misbahulhoda.mubashirhasan.dev ($VERSION) ==="
