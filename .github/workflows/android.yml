name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vue frontend
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/misbahuda-release.keystore

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > frontend/android/app/google-services.json

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-v1.0}"
          VERSION="${TAG#v}"
          echo "name=$VERSION"              >> $GITHUB_OUTPUT
          echo "tag=$TAG"                   >> $GITHUB_OUTPUT
          echo "code=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build release APK
        working-directory: frontend/android
        env:
          KEYSTORE_PATH:     "app/misbahuda-release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          APP_VERSION:       ${{ steps.version.outputs.name }}
          BUILD_NUMBER:      ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp frontend/android/app/build/outputs/apk/release/app-release.apk \
             MisbahulHoda-${{ steps.version.outputs.name }}.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Misbahuda v${{ steps.version.outputs.name }}
          body: |
            ## Misbah ul Hoda — Arbaeen 2026
            **Version:** ${{ steps.version.outputs.name }}

            ### Install
            1. Download `MisbahulHoda-${{ steps.version.outputs.name }}.apk`
            2. Enable "Install from unknown sources" in Android settings
            3. Open the downloaded file

            ### What's New
            - Push notifications support
            - Performance improvements
          files: MisbahulHoda-${{ steps.version.outputs.name }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
