name: Android Build & Deploy

on:
  push:
    tags:
      - 'v*'        # v1.1.0, v1.2.0 — Play Store deploy
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vue frontend
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/misbahuda-release.keystore

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > frontend/android/app/google-services.json

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-1.0}"
          VERSION="${TAG#v}"
          BUILD="${{ github.run_number }}"
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$BUILD"   >> $GITHUB_OUTPUT

      - name: Build release AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PATH:     "app/misbahuda-release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          APP_VERSION:       ${{ steps.version.outputs.name }}
          BUILD_NUMBER:      ${{ steps.version.outputs.code }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: misbahuda-${{ steps.version.outputs.name }}.aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
