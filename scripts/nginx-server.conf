# /etc/nginx/sites-available/misbahulhoda
# Place this on your Contabo server, then:
#   sudo ln -s /etc/nginx/sites-available/misbahulhoda /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d misbahulhoda.mubashirhasan.dev
#   sudo nginx -s reload

server {
    listen 80;
    server_name misbahulhoda.mubashirhasan.dev;

    # Certbot will fill in HTTPS redirect automatically
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name misbahulhoda.mubashirhasan.dev;

    # SSL — filled in by certbot
    # ssl_certificate /etc/letsencrypt/live/misbahulhoda.mubashirhasan.dev/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/misbahulhoda.mubashirhasan.dev/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # File upload limit (for photo uploads)
    client_max_body_size 10M;

    # Proxy to Docker frontend container (port 80)
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
