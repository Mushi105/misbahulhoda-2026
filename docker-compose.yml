services:
  postgres:
    image: postgres:16-alpine
    container_name: misbahuda_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-misbahuda_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Misbahuda@2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: misbahuda_redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: src/Misbahuda.API/Dockerfile
    container_name: misbahuda_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME:-misbahuda_db};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-Misbahuda@2026}
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=${JWT_SECRET:-Misbahuda_Super_Secret_Key_2026!}
      - Jwt__Issuer=Misbahuda.API
      - Jwt__Audience=Misbahuda.Client
      - Jwt__ExpiryMinutes=60
      - Cors__AllowedOrigins__0=https://misbahulhoda.mubashirhasan.dev
      - Cors__AllowedOrigins__1=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: misbahuda_frontend
    ports:
      - "3456:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
